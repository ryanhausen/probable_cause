<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <defs>
        <!-- Background Gradient -->
        <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
            <stop offset="0%" stop-color="#2a3040" />
            <stop offset="100%" stop-color="#0a0c10" />
        </radialGradient>

        <!-- Pillar Gradient -->
        <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#151820" />
            <stop offset="20%" stop-color="#2a3040" />
            <stop offset="80%" stop-color="#1a1c25" />
            <stop offset="100%" stop-color="#0a0c10" />
        </linearGradient>

        <linearGradient id="pedestalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#3a4050" />
            <stop offset="100%" stop-color="#1a1c25" />
        </linearGradient>

        <linearGradient id="tapeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffd700" />
            <stop offset="10%" stop-color="#ffa500" />
            <stop offset="50%" stop-color="#ffea00" />
            <stop offset="90%" stop-color="#ffa500" />
            <stop offset="100%" stop-color="#ffd700" />
        </linearGradient>

        <!-- Glow effect constraint -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="15" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Background Matrix -->
    <rect width="100%" height="100%" fill="url(#bgGrad)" />

    <!-- Floor (Perspective trapezoid) -->
    <polygon points="0,1080 1920,1080 1200,600 720,600" fill="#12151c" stroke="#1f2430" stroke-width="4" />

    <!-- Floor Grid Lines - Verticals -->
    <line x1="200" y1="1080" x2="800" y2="600" stroke="#1f2430" stroke-width="3" />
    <line x1="500" y1="1080" x2="900" y2="600" stroke="#1f2430" stroke-width="3" />
    <line x1="800" y1="1080" x2="1000" y2="600" stroke="#1f2430" stroke-width="3" />
    <line x1="1120" y1="1080" x2="1000" y2="600" stroke="#1f2430" stroke-width="3" />
    <line x1="1420" y1="1080" x2="1020" y2="600" stroke="#1f2430" stroke-width="3" />
    <line x1="1720" y1="1080" x2="1120" y2="600" stroke="#1f2430" stroke-width="3" />

    <!-- Floor Grid Lines - Horizontals -->
    <line x1="380" y1="850" x2="1540" y2="850" stroke="#1f2430" stroke-width="2" />
    <line x1="530" y1="750" x2="1390" y2="750" stroke="#1f2430" stroke-width="2" />
    <line x1="630" y1="680" x2="1290" y2="680" stroke="#1f2430" stroke-width="2" />
    <line x1="680" y1="630" x2="1240" y2="630" stroke="#1f2430" stroke-width="2" />

    <!-- Grand Archway in background (Smithsonian Style) -->
    <path d="M 600,600 L 600,300 Q 960,100 1320,300 L 1320,600 Z" fill="#151820" stroke="#2a3040" stroke-width="12" />
    <path d="M 680,600 L 680,350 Q 960,180 1240,350 L 1240,600 Z" fill="#0a0c10" stroke="#1a1c25" stroke-width="8" />
    <!-- Distant doorway inside the arch -->
    <rect x="880" y="450" width="160" height="150" fill="#050608" stroke="#12151c" stroke-width="4" />

    <!-- Side Pillars Left (Museum structural columns) -->
    <rect x="-50" y="-50" width="300" height="1200" fill="url(#pillarGrad)" />
    <rect x="250" y="50" width="80" height="1100" fill="url(#pillarGrad)" />
    <rect x="380" y="150" width="120" height="950" fill="url(#pillarGrad)" />
    <!-- Indents -->
    <rect x="420" y="200" width="40" height="850" fill="#11131a" />

    <!-- Side Pillars Right -->
    <rect x="1670" y="-50" width="300" height="1200" fill="url(#pillarGrad)" />
    <rect x="1590" y="50" width="80" height="1100" fill="url(#pillarGrad)" />
    <rect x="1420" y="150" width="120" height="950" fill="url(#pillarGrad)" />
    <!-- Indents -->
    <rect x="1460" y="200" width="40" height="850" fill="#11131a" />

    <!-- Arch tops extending from pillars to ceiling -->
    <path d="M 0,0 Q 400,200 600,300 L 600,0 Z" fill="#11131a" />
    <path d="M 1920,0 Q 1520,200 1320,300 L 1320,0 Z" fill="#11131a" />

    <!-- Architectural trim lines -->
    <rect x="0" y="0" width="1920" height="20" fill="#000" />
    <rect x="0" y="80" width="1920" height="10" fill="#151820" />

    <!-- Display Pedestal (Center of the room) -->
    <polygon points="860,650 1060,650 1120,850 800,850" fill="url(#pedestalGrad)" stroke="#4a5060" stroke-width="2" />
    <polygon points="800,850 1120,850 1140,880 780,880" fill="#2a3040" />
    <polygon points="780,880 1140,880 1140,920 780,920" fill="#151820" />
    <!-- Pedestal trim Details -->
    <line x1="820" y1="840" x2="1100" y2="840" stroke="#11131a" stroke-width="4" />

    <!-- Broken Glass Case -->
    <!-- Broken base edges -->
    <polygon points="860,650 1060,650 1060,400 860,400" fill="none" stroke="#88ccff" stroke-width="1.5" opacity="0.3" />
    <line x1="860" y1="400" x2="900" y2="350" stroke="#88ccff" stroke-width="1.5" opacity="0.3" />
    <line x1="1060" y1="400" x2="1020" y2="350" stroke="#88ccff" stroke-width="1.5" opacity="0.3" />

    <!-- Broken glass shards standing on pedestal -->
    <polygon points="860,650 880,580 920,650" fill="#88ccff" opacity="0.5" />
    <polygon points="1060,650 1080,620 1010,650" fill="#88ccff" opacity="0.6" />
    <polygon points="950,650 970,600 990,650" fill="#aaddff" opacity="0.4" />
    <polygon points="900,650 930,520 940,650" fill="#88ccff" opacity="0.7" />

    <!-- Glass shards on the floor around the pedestal -->
    <polygon points="750,950 780,930 800,960 770,980" fill="#88ccff" opacity="0.4" />
    <polygon points="1100,960 1150,920 1170,950" fill="#aaddff" opacity="0.5" />
    <polygon points="900,1000 940,980 950,1020" fill="#88ccff" opacity="0.6" />
    <polygon points="820,900 850,890 860,910" fill="#aaddff" opacity="0.7" />
    <polygon points="1200,900 1220,910 1190,930" fill="#88ccff" opacity="0.5" />

    <!-- Space where the golden falcon should have been (Ethereal lingering glow) -->
    <ellipse cx="960" cy="500" rx="60" ry="100" fill="#fff" opacity="0.05" filter="url(#glow)" />
    <circle cx="960" cy="520" r="30" fill="#fff" opacity="0.1" filter="url(#glow)" />

    <!-- Yellow Police Tape -->
    <!-- Tape 1 (Back left to front right) -->
    <path d="M 600,600 Q 960,700 1300,850" fill="none" stroke="url(#tapeGrad)" stroke-width="25" opacity="0.9" />
    <!-- Tape 1 Striping/Textured markings inside tape -->
    <path d="M 600,600 Q 960,700 1300,850" fill="none" stroke="#111" stroke-width="25" stroke-dasharray="30 30" opacity="0.5" />

    <!-- Tape 2 (Front left to back right) -->
    <path d="M 650,900 Q 960,800 1350,650" fill="none" stroke="url(#tapeGrad)" stroke-width="20" opacity="0.95" />
    <!-- Tape 2 Striping -->
    <path d="M 650,900 Q 960,800 1350,650" fill="none" stroke="#111" stroke-width="20" stroke-dasharray="25 25" opacity="0.5" />

    <!-- Tape 3 (Bold foreground tape wrapping around) -->
    <path d="M -50,1000 Q 960,850 1970,1050" fill="none" stroke="url(#tapeGrad)" stroke-width="45" opacity="0.95" />
    <!-- Tape 3 Striping -->
    <path d="M -50,1000 Q 960,850 1970,1050" fill="none" stroke="#111" stroke-width="45" stroke-dasharray="50 50" opacity="0.6" />

    <!-- General Dark Ambient Lighting Effects (Vignette mapped over everything) -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
        <stop offset="50%" stop-color="#000" stop-opacity="0" />
        <stop offset="85%" stop-color="#000" stop-opacity="0.6" />
        <stop offset="100%" stop-color="#000" stop-opacity="0.9" />
    </radialGradient>
    <rect width="100%" height="100%" fill="url(#vignette)" pointer-events="none" />
</svg>
